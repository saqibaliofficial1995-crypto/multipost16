name: Comment Reply

on:
  schedule:
    - cron: '50 7,19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not post replies)'
        required: false
        default: true
        type: boolean

concurrency:
  group: multipost16-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client requests

      - name: Run Comment Reply
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" -a "${{ inputs.dry_run }}" != "false" ]; then
            ARGS="--dry-run"
          fi
          python -m src.comment_reply $ARGS

      - name: Commit state updates
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "saqibaliofficial1995-crypto"
          git config user.email "saqibaliofficial1995@gmail.com"
          git add state/replied.json
          git diff --staged --quiet || git commit -m "Automated state update: replied comments [skip ci]"
          git push origin main
